# train options
seed: 42
batch_size: 64
start_epoch: 0
train_epochs: 100
mask_ratio: 0.75
augmentation: "Jittering"
# "Jittering", "Scaling", "Flipping"， "Permutation", "Resizing", "TimeMasking",
#Freq_RandomMasking, Timewise_neighboring (change pretrain dataset transform parameters)


# dataset related
dataset: "UCR"


dataset_: "FordA"
n_class: 2
n_channel: 1
n_length: 500
patch_length: 25

#dataset_: "ChlorineConcentration"
#n_class: 3
#n_channel: 1
#n_length: 160  # original 166, take 160
#patch_length: 8


# model options
projection_dim:  512


# loss options
optimizer: "AdamW"
lr: 1.5e-4
weight_decay: 0.05
temperature: 0.5
warmup_epoch: 5


# reload options
model_path: "save"


# classifier options
finetune_batch_size: 64
finetune_epochs: 100
finetune_base_learning_rate: 1.5e-4


# finetune options
pretrain: False
#pretrain: True
labelled_ratio: 0.3

finetune_seed: 42
